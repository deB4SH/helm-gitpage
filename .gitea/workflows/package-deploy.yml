name: helm-package-and-deploy

on:
  push:
    tags:
      - "*"

jobs:
  package-and-deploy:
    if: "!contains(github.event.head_commit.message, '[skip-branch-ci]')"
    uses: Public-Actions/helm-package-deploy/.gitea/workflows/package-and-deploy.yaml@release/1.0.1
    secrets: inherit
    with:
      buildImage: ${{ vars.HELM_IMAGE }}
