name: helm-package-and-deploy

on:
  push:
    branches:
      - main

jobs:
  update-version:
    if: "!contains(github.event.head_commit.message, '[skip-branch-ci]')"
    uses: Public-Actions/helm-version-update/.gitea/workflows/update-version.yaml@release/0.0.5
    secrets: inherit
    with:
      buildImage: ${{ vars.HELM_IMAGE }}
