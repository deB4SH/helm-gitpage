{{- if .Values.service.loadbalancer.enabled }}
kind: Service
apiVersion: v1
metadata:
  name: {{.Release.Name}}-loadbalancer
  labels:
    app: {{.Release.Name}}-gitpage
  annotations:
    {{- range $key, $value := .Values.service.loadbalancer.annotations}}
    {{ $key }}: {{ tpl $value $ }}
    {{- end}}
spec:
  selector:
    app: {{.Release.Name}}-gitpage
  ports:
    {{- toYaml .Values.deployment.ports | nindent 4 }}
  type: LoadBalancer
{{- end }}
