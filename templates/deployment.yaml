apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Release.Name}}-gitpage
  labels:
    app: {{.Release.Name}}-gitpage
spec:
  strategy:
    type: RollingUpdate
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{.Release.Name}}-gitpage
  template:
    metadata:
      labels:
        app: {{.Release.Name}}-gitpage
    spec:
      affinity:
        {{- toYaml .Values.deployment.affinity | nindent 12 }}
      containers:
        - name: sync
          image: {{ .Values.sync.image.repository }}:{{ .Values.sync.image.tag }}
          command: [ "git-sync"]
          args:
            - "--repo={{ .Values.sync.args.repo }}"
            - "--ref={{ .Values.sync.args.branch }}"
            - "--period=10s"
            - "--root=/data"
          volumeMounts:
            - name: data
              mountPath: "/data"
              readOnly: false
        - name: nginx
          image: {{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}
          imagePullPolicy: IfNotPresent
          {{- if .Values.deployment.sleepStart }}
          # Just spin & wait forever
          command: [ "/bin/sh", "-c", "--" ]
          args: [ "while true; do sleep 30; done;" ]
          {{- end }}
          ports:
            {{- range .Values.deployment.ports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: "/usr/share/nginx/html"
              readOnly: false
            - name: config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: {{.Release.Name}}-gitpage-nginx-configuration
